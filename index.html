<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH · developer portfolio</title>
    <!-- Google Fonts: Inter + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* reset & base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', 'Space Grotesk', sans-serif;
        background: #080A0D;
        color: #F5F5F5;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      ul {
        list-style: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      /* scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #080A0D;
      }
      ::-webkit-scrollbar-thumb {
        background: #5ED7E8;
        border-radius: 12px;
      }
      /* utility */
      .container {
        max-width: 1360px;
        margin: 0 auto;
        padding: 0 32px;
      }
      .section-label {
        font-size: 0.7rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #6F747C;
        margin-bottom: 2rem;
        display: inline-block;
        border-bottom: 1px solid rgba(94, 215, 232, 0.25);
        padding-bottom: 0.5rem;
      }
      .section-title {
        font-size: 3.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 1.75rem;
      }
      @media (max-width: 768px) {
        .section-title {
          font-size: 2.4rem;
        }
        .container {
          padding: 0 20px;
        }
      }
      /* reduced motion */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
